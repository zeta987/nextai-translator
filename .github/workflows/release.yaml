name: Fork Release

# Personal fork release pipeline: Windows x64 only.
# Triggered by tags shaped `fork-v<semver>` (e.g. fork-v0.6.42) so they never
# collide with upstream's `v<semver>` tags that get fetched into local clones.
# The updater artifacts (latest.json + .sig) are generated by tauri-action and
# require TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# repository secrets matching the pubkey in src-tauri/tauri.conf.json.

on:
  push:
    tags: ['fork-v*']

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#fork-v}" >> "$GITHUB_OUTPUT"

      - name: Get tag message
        id: tag
        # contents:subject/body exclude the SSH/GPG signature block that
        # %(contents) would leak into the release notes on signed tags.
        run: |
          git fetch --depth=1 origin +refs/tags/*:refs/tags/*
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$(git tag -l --format='%(contents:subject)' ${GITHUB_REF_NAME})" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "$(git tag -l --format='%(contents:body)' ${GITHUB_REF_NAME})" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create-release
        uses: ncipollo/release-action@v1
        with:
          draft: true
          name: ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          body: "${{ steps.tag.outputs.message }}"

  build-tauri-renderer:
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Change Version
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: make change-version change-package-version

      - name: Build tauri renderer
        run: pnpm build-tauri-renderer

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-renderer
          path: dist/tauri/

  build-tauri-windows:
    needs: [create-release, build-tauri-renderer]
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Change Version
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: make change-version change-package-version
        shell: bash

      - uses: actions/download-artifact@v4
        with:
          name: tauri-renderer
          path: dist/tauri

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tauriScript: pnpm tauri
          updaterJsonPreferNsis: true

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    needs: [create-release, build-tauri-windows]

    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false
            })
